      - name: Extract zip archives if present (nested too)
        run: |
          for pass in 1 2 3 4; do
            found=0
            while IFS= read -r zipfile; do
              target_dir="${zipfile%.zip}"
              if [ ! -d "$target_dir" ]; then
                echo "Extracting: $zipfile"
                mkdir -p "$target_dir"
                unzip -q -o "$zipfile" -d "$target_dir" || true
                found=1
              fi
            done < <(find . -type f -iname "*.zip" -not -path "./.git/*")
            if [ "$found" = 0 ]; then break; fi
          done
