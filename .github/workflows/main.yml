name: Build Flutter App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract zip archives if present
        run: |
          mkdir -p ./extracted_project
          find . -maxdepth 2 -name "*.zip" -exec unzip -o "{}" -d ./extracted_project \;
          while find ./extracted_project -name "*.zip" | grep -q .; do
            find ./extracted_project -name "*.zip" | while read zip_file; do
              target_dir="${zip_file%.zip}_unzipped"
              unzip -o "$zip_file" -d "$target_dir"
              rm -f "$zip_file"
            done
          done

      - name: Locate Flutter project root
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found anywhere in the repository!"
            find . -maxdepth 4
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$PUBSPEC_PATH")
          echo "Found Flutter project at: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Generate missing Android scaffolding
        run: |
          cd "$PROJECT_ROOT"
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Install dependencies
        run: |
          cd "$PROJECT_ROOT"
          if [ -f "pubspec.yaml" ]; then
            sed -i 's/^\([[:space:]]*google_mobile_ads:\).*/\1 any/' pubspec.yaml
          fi
          flutter pub upgrade google_mobile_ads || true
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          WRAPPER_PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROPS" ]; then
            sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-all.zip|g' "$WRAPPER_PROPS"
          fi
          for f in android/settings.gradle android/settings.gradle.kts android/build.gradle android/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/8\.9\.[0-9]*/9.1.1/g' "$f"
            fi
          done
          for gma_gradle in "$HOME"/.pub-cache/hosted/pub.dev/google_mobile_ads-*/android/build.gradle; do
            if [ -f "$gma_gradle" ]; then
              echo "=== Inspecting $gma_gradle around line 54 ==="
              nl -ba "$gma_gradle" | sed -n '48,60p'
              sed -i 's/\.all\b/.all { true }/g' "$gma_gradle" || true
            fi
          done
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
