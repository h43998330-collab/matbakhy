أكيد، إليك تعديل جاهز لملف main.yml يطابق خطوات الـ Workflow الموجودة في الصور (Extract zip archives if present، Locate Flutter project root، Generate missing Android scaffolding، Install dependencies، Build APK، Upload APK artifact)، مع إضافة فك الضغط المتداخل لأي ملفات .zip والبحث عن pubspec.yaml بعد فك الضغط بالكامل:
```yaml
name: Build Flutter App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract zip archives if present
        run: |
          mkdir -p ./extracted_project
          # فك ملفات zip الأساسية أولاً
          find . -maxdepth 2 -name "*.zip" -exec unzip -o "{}" -d ./extracted_project \;
          # فك أي ملفات zip متداخلة داخل المجلد المستخرج
          while find ./extracted_project -name "*.zip" | grep -q .; do
            find ./extracted_project -name "*.zip" | while read zip_file; do
              target_dir="${zip_file%.zip}_unzipped"
              unzip -o "$zip_file" -d "$target_dir"
              rm -f "$zip_file"
            done
          done

      - name: Locate Flutter project root
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found anywhere in the repository!"
            find . -maxdepth 4
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$PUBSPEC_PATH")
          echo "Found Flutter project at: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Generate missing Android scaffolding
        run: |
          cd "$PROJECT_ROOT"
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Install dependencies
        run: |
          cd "$PROJECT_ROOT"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk

```
### ملاحظات سريعة:
 * خطوة **Extract zip archives if present** بتفك أي ملف .zip حتى لو كان جوه ملف مضغوط تاني (زي matbakhy_merged (3).zip).
 * خطوة **Locate Flutter project root** بتحدد مسار مجلد المشروع اللي فيه pubspec.yaml وتخزنه في متغير PROJECT_ROOT عشان باقي الأوامر تشتغل جواه مباشرة.
 * لو ظهر خطأ أثناء flutter build apk بعد ما يلاقي pubspec.yaml، ابعتلي لوج الخطوة دي وهنحلها سوا.
